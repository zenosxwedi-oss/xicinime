name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**"]

jobs:
  build:
    name: Build APK (EAS Preview)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Setup EAS CLI
        run: npm install -g eas-cli@latest

      - name: Build APK with EAS
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive

      - name: Print APK download link
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "✅ Build submitted to EAS."
          echo "📱 Check APK at: https://expo.dev/accounts/xick/projects/xicinime-mobile/builds"
          eas build:list --platform android --limit 1 2>/dev/null || true
