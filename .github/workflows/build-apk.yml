name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**"]

jobs:
  build:
    name: Build APK (EAS Preview)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Setup EAS CLI
        run: npm install -g eas-cli@latest

      - name: Create Expo project (if not linked)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Create project on expo.dev so EAS gets a valid UUID
          eas init --id xicinime-mobile --non-interactive 2>/dev/null || eas init --non-interactive || true

      - name: Build APK with EAS
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive

      - name: Get APK download URL
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Build submitted. Check https://expo.dev/accounts/xick/projects/xicinime-mobile/builds for the APK download link."
          eas build:list --platform android --limit 1 --json 2>/dev/null | python3 -c "import sys,json; data=json.load(sys.stdin); print('APK URL:', data[0].get('artifacts',{}).get('buildUrl','(pending)'))" || true
