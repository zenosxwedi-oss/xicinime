name: Build & Release APK

  on:
    push:
      tags:
        - 'v*'
    workflow_dispatch:
      inputs:
        version:
          description: 'Version tag (e.g. v1.0.1)'
          required: true
          default: 'v1.0.0'

  permissions:
    contents: write

  jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'

        - name: Set version
          id: version
          run: |
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              TAG="${{ github.event.inputs.version }}"
            else
              TAG="${GITHUB_REF#refs/tags/}"
            fi
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT

        - name: Update version in build.gradle
          run: |
            VERSION="${{ steps.version.outputs.version }}"
            BUILD_NUM=$(echo "$VERSION" | tr -d '.' | sed 's/^0*//')
            BUILD_NUM="${BUILD_NUM:-1}"
            sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android-app/app/build.gradle
            sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUM/" android-app/app/build.gradle

        - name: Generate launcher PNG icons
          run: |
            sudo apt-get install -y imagemagick -q
            BASE="android-app/app/src/main/res"
            for entry in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
              DNAME=$(echo "$entry" | cut -d: -f1)
              SIZE=$(echo "$entry" | cut -d: -f2)
              HALF=$((SIZE/2))
              RADIUS=$((SIZE*38/100))
              DIR="$BASE/$DNAME"
              mkdir -p "$DIR"
              convert -size "${SIZE}x${SIZE}" xc:"#0d0d14" \
                -fill "#4f46e5" \
                -draw "circle ${HALF},${HALF} ${HALF},$((HALF-RADIUS))" \
                "$DIR/ic_launcher.png"
              cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png"
              echo "Generated $DNAME (${SIZE}px)"
            done

        - name: Generate keystore
          run: |
            keytool -genkey -v \
              -keystore android-app/app/keystore.jks \
              -alias xicinime \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=XiciNime,OU=Mobile,O=XiciNime,L=Jakarta,S=DKI,C=ID" \
              -storepass xicinime2025 -keypass xicinime2025

        - name: Set up Gradle
          uses: gradle/actions/setup-gradle@v3
          with:
            gradle-version: '8.5'

        - name: Create local.properties
          run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android-app/local.properties

        - name: Build Release APK
          working-directory: android-app
          run: |
            gradle assembleRelease \
              -PKEYSTORE_PATH=keystore.jks \
              -PKEYSTORE_PASSWORD=xicinime2025 \
              -PKEY_ALIAS=xicinime \
              -PKEY_PASSWORD=xicinime2025

        - name: Prepare APK
          run: |
            cp android-app/app/build/outputs/apk/release/app-release.apk XiciNime.apk
            ls -lh XiciNime.apk

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ steps.version.outputs.tag }}
            name: "XiciNime ${{ steps.version.outputs.tag }}"
            body: |
              ## XiciNime ${{ steps.version.outputs.tag }}

              Aplikasi streaming anime sub indo gratis untuk Android.

              ### Download
              Klik **XiciNime.apk** di bawah untuk download.

              ### Cara Install
              1. Download **XiciNime.apk**
              2. Buka file di HP Android
              3. Jika muncul peringatan — tap **Tetap Install** / **Install Anyway**
              4. Aktifkan **Izinkan dari sumber ini** jika diminta
              5. Tap **Install**

              > Peringatan APK tidak dikenal adalah normal untuk APK di luar Play Store. APK ini sudah ditandatangani digital dan aman.
            files: XiciNime.apk
            make_latest: true
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  