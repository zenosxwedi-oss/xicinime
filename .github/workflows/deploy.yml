name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Prepare Vercel output structure
        run: |
          mkdir -p .vercel/output/functions/api/index.func

          cp artifacts/api-server/vercel-dist/handler.mjs .vercel/output/functions/api/index.func/index.mjs
          for f in pino-worker.mjs pino-file.mjs pino-pretty.mjs thread-stream-worker.mjs; do
            [ -f "artifacts/api-server/vercel-dist/$f" ] && cp "artifacts/api-server/vercel-dist/$f" ".vercel/output/functions/api/index.func/$f" || true
          done

          cat > .vercel/output/functions/api/index.func/.vc-config.json << 'EOF'
          {
            "handler": "index.mjs",
            "launcherType": "Nodejs",
            "runtime": "nodejs20.x",
            "maxDuration": 30
          }
          EOF

          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              { "src": "/(.*)", "dest": "/api/index" }
            ]
          }
          EOF

          cat > .vercel/project.json << 'EOF'
          {
            "orgId": "${{ secrets.VERCEL_ORG_ID }}",
            "projectId": "${{ secrets.VERCEL_PROJECT_ID }}"
          }
          EOF

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (prebuilt)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
