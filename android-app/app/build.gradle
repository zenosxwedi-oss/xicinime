plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xicinime.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.xicinime.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile     file(project.findProperty("KEYSTORE_PATH") ?: "keystore.jks")
            storePassword (project.findProperty("KEYSTORE_PASSWORD") ?: "")
            keyAlias      (project.findProperty("KEY_ALIAS")          ?: "")
            keyPassword   (project.findProperty("KEY_PASSWORD")       ?: "")
        }
    }

    buildTypes {
        release {
            minifyEnabled   false
            signingConfig   signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
